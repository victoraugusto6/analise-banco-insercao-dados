name: Action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install flake8
        run: pip install flake8

      - name: flake8
        run: flake8 .
