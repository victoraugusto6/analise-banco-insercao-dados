[project]
name = "postgresql-mariadb-insert-benchmark"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.9",
    "pandas>=3.0.2",
    "psycopg[binary]>=3.3.2",
    "pymysql>=1.1.2",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "flake8>=7.3.0",
    "ipdb>=0.13.13",
    "ipython>=9.9.0",
    "pre-commit>=4.5.1",
]

[tool.black]
line-length = 88
target-version = ["py313"]
exclude = '''
/(
  \.venv
| \.pgdata
| migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = [".venv", ".pgdata", "migrations"]
